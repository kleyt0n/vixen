<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vixen</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #stage { position: fixed; inset: 0; }
    /* The fox sits in a corner; the window grows away from it when a message shows. */
    .fb { position: absolute; right: 4px; bottom: 4px; width: 64px; height: 64px; cursor: pointer; transition: transform 0.15s ease; }
    .right .fb { right: auto; left: 4px; }
    .down .fb { bottom: auto; top: 4px; }
    .fb:hover { transform: translateY(-2px) scale(1.04); }
    .buddy { width: 64px; height: 64px; display: block; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transform-origin: 50% 100%; }

    /* While jobs run: Kit, Snow, Arara, Pilot and Onça wag their tail, Sleepy breathes. */
    .tail { transform-box: view-box; transform-origin: 40px 52px; }
    .breath { transform-box: view-box; transform-origin: 32px 56px; }
    .busy .tail { animation: wag 2.6s ease-in-out infinite; }
    .busy .breath { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025, 1.045); } }

    /* Events: a happy hop when a job finishes, an alert wiggle for limits. */
    .hop .buddy { animation: hop 0.9s cubic-bezier(.3,.7,.4,1) 2; }
    .wiggle .buddy { animation: wiggle 0.7s ease-in-out 3; }
    .perk .buddy { animation: perk 0.5s ease-out 2; }
    .droop .buddy { animation: droop 1.6s ease-in-out 1 forwards; }
    @keyframes perk { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-7px) scale(1.04); } }
    @keyframes droop {
      0% { transform: none; }
      25% { transform: translateY(4px) scale(1.03, 0.94) rotate(-4deg); }
      40% { transform: translateY(4px) scale(1.03, 0.94) rotate(4deg); }
      55% { transform: translateY(4px) scale(1.03, 0.94) rotate(-3deg); }
      100% { transform: translateY(2px) scale(1.01, 0.97); }
    }
    @keyframes hop {
      0% { transform: translateY(0) scale(1, 1); }
      15% { transform: translateY(0) scale(1.12, 0.86); }
      45% { transform: translateY(-16px) scale(0.94, 1.08); }
      75% { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .busy .tail, .busy .breath, .hop .buddy, .wiggle .buddy, .perk .buddy, .droop .buddy { animation: none; } }

    .alert { position: absolute; bottom: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%;
      background: #ffb340; box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0, 0, 0, 0.3); }

    /* Speech bubble, pointing at the fox. */
    .bubble {
      position: absolute; right: 60px; bottom: 46px; width: max-content; max-width: 256px; box-sizing: border-box;
      display: grid; grid-template-columns: 22px minmax(0, 1fr) 18px; gap: 9px; align-items: start;
      padding: 9px 7px 9px 9px; border-radius: 14px; cursor: pointer;
      background: rgba(30, 30, 34, 0.95); color: #f5f5f7;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10) inset, 0 8px 24px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transform-origin: 100% 100%; animation: pop 0.28s cubic-bezier(.2,.9,.3,1.3);
    }
    .bubble::after { content: ""; position: absolute; right: -5px; bottom: 9px; width: 12px; height: 12px;
      background: rgba(30, 30, 34, 0.95); transform: rotate(45deg); border-radius: 2px; }
    .right .bubble { right: auto; left: 60px; transform-origin: 0 100%; }
    .right .bubble::after { right: auto; left: -5px; }
    .down .bubble { bottom: auto; top: 46px; transform-origin: 100% 0; }
    .down .bubble::after { bottom: auto; top: 9px; }
    .bubble.out { animation: fade 0.25s ease forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 0; transform: scale(0.9); } }
    .b-ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .done .b-ico { background: #32d74b; color: #06210c; }
    .start .b-ico { background: #64a0ff; color: #061a3a; font-size: 9px; }
    .failed .b-ico { background: #ff6961; color: #3a0705; }
    .limit .b-ico { background: #ffb340; color: #3a2400; }
    .insight .b-ico { background: #bf9bff; color: #1d0a3a; font-size: 11px; }
    .b-close {
      width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); color: #c7c7cc;
      font: 600 12px/1 -apple-system, sans-serif;
    }
    .b-close:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .b-more { display: inline-block; margin-top: 5px; font-size: 10.5px; color: #8e8e93; }
    /* Long insight headlines are clamped so the bubble never outgrows the window; hover shows it all. */
    .b-title, .b-detail { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .b-title { font-size: 12px; font-weight: 600; line-height: 1.3; -webkit-line-clamp: 3; }
    .b-detail { font-size: 11px; color: #a1a1a6; margin-top: 2px; line-height: 1.35; -webkit-line-clamp: 4; }
    .b-detail:empty { display: none; }
    .b-meter { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin-top: 6px; overflow: hidden; }
    .b-meter i { display: block; height: 100%; border-radius: 2px; background: #ffb340; }
    .b-meter i.red { background: #ff6961; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="bubble" id="bubble" hidden>
      <span class="b-ico" id="b-ico"></span>
      <div><span class="b-title" id="b-title"></span><span class="b-detail" id="b-detail"></span><div class="b-meter" id="b-meter" hidden><i></i></div><span class="b-more" id="b-more" hidden></span></div>
      <button class="b-close" id="b-close" title="Dismiss">✕</button>
    </div>
    <div class="fb" id="fb" title="Vixen">
      <span id="fox"></span>
      <span class="alert" id="alert" hidden></span>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="foxes.js"></script>
  <script src="float.js"></script>
</body>
</html>
