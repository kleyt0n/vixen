<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vixen</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel-body">
  <div class="panel">
    <header class="p-head" title="Drag to move · double-click to fit content">
      <svg class="logo"><use href="#logo"/></svg>
      <div class="p-title"><b id="p-title">Vixen</b><span id="p-sub"></span></div>
      <button class="ghost icon" id="p-refresh" title="Refresh now">↻</button>
    </header>
    <div class="p-tiles" id="p-tiles"></div>
    <div class="p-scroll" id="p-scroll">
      <div id="p-banner"></div>
      <section class="p-sec" id="sec-needs"><div class="p-label">Needs you <button class="link" id="p-needs-clear">Clear all</button></div><div id="p-needs"></div></section>
      <section class="p-sec" id="sec-run"><div class="p-label">Running <b id="p-next"></b></div><div id="p-timeline" class="timeline"></div><div id="p-queued"></div></section>
      <section class="p-sec" id="sec-limits"><div class="p-label">Limits</div><div id="p-limits"></div></section>
      <section class="p-sec" id="sec-machines"><div class="p-label">Machines</div><div id="p-machines" class="chips"></div></section>
    </div>
    <footer class="p-foot">
      <button class="ghost" data-a="open">Open Vixen</button>
      <button class="ghost" data-a="settings">Settings…</button>
      <span class="spacer"></span>
      <span class="p-updated" data-ago="0" id="p-updated"></span>
      <button class="ghost" data-a="quit">Quit</button>
    </footer>
  </div>
  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
