# Tag a version (git tag v0.1.0 && git push --tags) to build and publish:
#   vixen-<target>.tar.gz / .zip   CLI for macOS, Linux (static musl) and Windows
#   Vixen-<arch>.app.tar.gz        macOS menu-bar app
#   SHA256SUMS                     verified by scripts/install.sh and install.ps1
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: cli · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, zig: true }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p vixen-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p vixen-cli --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          mkdir dist
          dir=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "dist/vixen-${{ matrix.target }}.zip" "./$dir/vixen.exe"
          else
            tar -czf "dist/vixen-${{ matrix.target }}.tar.gz" -C "$dir" vixen
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  app:
    name: app · ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - name: build Vixen.app
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.arch }}-apple-darwin --bundles app
      - name: package
        run: |
          mkdir dist
          tar -czf "dist/Vixen-${{ matrix.arch }}.app.tar.gz" \
            -C "target/${{ matrix.arch }}-apple-darwin/release/bundle/macos" Vixen.app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [cli, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
