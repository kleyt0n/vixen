name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p vixen-core -p vixen-cli -- -D warnings
      - run: cargo test --locked -p vixen-core -p vixen-cli
        if: runner.os != 'Windows' # tests exercise /bin/sh
      - run: cargo clippy --locked -p vixen-app -- -D warnings
        if: runner.os == 'macOS'
