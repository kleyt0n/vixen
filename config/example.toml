# vixen targets — copy to ~/.config/vixen/config.toml (or run `vixen init`).
#
# kind       = "host" (default) | "modal" | "vast" | "skypilot"
# host       = SSH alias from ~/.ssh/config; omit to monitor this machine
# scheduler  = "none" (default) | "slurm" | "sge"
# host_gpus  = sample GPUs on the host itself with nvidia-smi or amd-smi (Apple GPU when local)
# command    = cloud kinds only: CLI to run (default modal / vastai / sky)
# job_gpus   = Slurm only: sample GPUs inside your running jobs (srun --overlap)
# all_users  = show everyone's jobs, not just yours
# interval   = seconds between polls (global default below; a target may override it)

interval = 300              # 5 minutes; ↻ / ⌘R polls immediately


# Code agents on this Mac (Claude Code, Codex, Antigravity), read from their
# local session files. Remove this table to use the defaults shown.
[agents]
enabled      = true
window_hours = 24        # list sessions active within this many hours
interval     = 5         # seconds between scans (only changed files are re-read)
claude_code  = true
codex        = true
antigravity  = true
# Fetch Claude plan limits live using Claude Code's saved login (macOS asks once
# for Keychain access). Off: limits update only when you run /usage in Claude Code.
live_claude_limits = false

# Insights: a local model reads running jobs' logs and agents' transcripts and
# writes a headline plus a short note per job and session (Home, each row, the
# menu bar, and the floating fox). Needs Ollama (ollama.com): `ollama pull gemma3`.
# Data goes only to `url`; keep it on localhost to stay on this machine.
[insights]
enabled  = false
url      = "http://localhost:11434"
model    = ""            # as in `ollama list`; empty picks a general chat model
interval = 300           # seconds between summaries; skipped while nothing changes
job_logs = true          # include the last lines of running jobs' logs (one SSH round trip each)

# A GPU server running its own Slurm controller (e.g. a DGX box).
[[target]]
name      = "dgx"
host      = "dgx"
scheduler = "slurm"
host_gpus = true

# An HPC cluster on Slurm: GPU jobs run on compute nodes, sampled in-job.
[[target]]
name      = "hpc"
host      = "hpc-login"
scheduler = "slurm"
job_gpus  = true

# An HPC cluster on SGE / Grid Engine.
[[target]]
name      = "hpc-sge"
host      = "hpc-sge-login"
scheduler = "sge"

[[target]]
name     = "modal"
kind     = "modal"

# Vast.ai instances (`vastai set api-key …` first). GPU utilisation comes from Vast, no SSH needed.
# [[target]]
# name = "vast"
# kind = "vast"

# SkyPilot clusters and managed jobs on any cloud it supports (AWS, GCP, Azure, Lambda, RunPod, Kubernetes…).
# [[target]]
# name = "sky"
# kind = "skypilot"

# This Mac (Apple GPU utilization).
[[target]]
name      = "local"
host_gpus = true

# Any other NVIDIA or AMD box (Lambda, RunPod, a workstation…):
# [[target]]
# name      = "lambda"
# host      = "lambda-a100"
# host_gpus = true
